<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Appointment</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root {
      --primary: #ffffff;
      --secondary: #000000;
      --accent: #ff0000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: var(--secondary);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--primary);
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 30px;

      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .logo {
      display: block;
      max-width: 220px;
      max-height: 90px;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .loading {
      text-align: center;
      padding: 30px 0;
      color: #666;
    }

    .error {
      display: none;
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #b00000;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .success {
      display: none;
      background: #f0fff4;
      border: 1px solid #b7ebc6;
      color: #146c2e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .booking-details {
      display: none;
      margin-bottom: 25px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .detail-label {
      font-weight: bold;
    }

    .detail-value {
      text-align: right;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 7px;
      padding: 14px 18px;

      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary {
      background: var(--secondary);
      color: var(--primary);
    }

    .primary:hover:not(:disabled) {
      opacity: 0.85;
    }

    .cancel {
      background: var(--accent);
      color: #ffffff;
    }

    .cancel:hover:not(:disabled) {
      opacity: 0.85;
    }

    .secondary {
      background: #eeeeee;
      color: #000000;
    }

    .secondary:hover:not(:disabled) {
      background: #dddddd;
    }

    .reschedule-section {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
    }

    .reschedule-section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      background: #ffffff;
    }

    .field {
      margin-bottom: 18px;
    }

    .muted {
      color: #666;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }

    /* =======================================================
       CUSTOM ALERT / CONFIRM
    ======================================================== */

    #customAlertOverlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.72);
    }

    #customAlertOverlay.show {
      display: flex;
    }

    .customAlertBox {
      width: min(92vw, 760px);
      min-height: 360px;
      padding: 34px 42px 30px;
      background: #e6e6e6;
      color: #000;
      border: 6px solid #ed1c24;
      border-radius: 64px;
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .customAlertLogo {
      width: min(300px, 55%);
      max-height: 100px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    #customAlertMessage {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px 24px;
      font-size: clamp(22px, 3vw, 42px);
      line-height: 1.2;
      font-weight: bold;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .customAlertButtons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .customAlertButton {
      min-width: 120px;
      padding: 11px 24px;
      border: 0;
      border-radius: 7px;
      background: #000;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .customAlertButton:hover {
      background: #555;
    }

    .customAlertButton.cancel {
      background: #8b0000;
    }

    @media (max-width: 600px) {
      #customAlertOverlay {
        padding: 14px;
      }

      .customAlertBox {
        min-height: 280px;
        padding: 25px 20px 22px;
        border-width: 5px;
        border-radius: 42px;
      }

      .customAlertLogo {
        width: min(220px, 70%);
        max-height: 72px;
        margin-bottom: 8px;
      }

      #customAlertMessage {
        padding: 8px 4px 18px;
        font-size: clamp(19px, 6vw, 30px);
      }

      .customAlertButtons {
        gap: 8px;
      }

      .customAlertButton {
        min-width: 100px;
        padding: 10px 16px;
        font-size: 14px;
      }
    }

      .container {
        padding: 22px;
      }

      h1 {
        font-size: 24px;
      }

      .detail-row {
        flex-direction: column;
        gap: 4px;
      }

      .detail-value {
        text-align: left;
      }
    }

/* =========================================
   RESCHEDULE DATE CALENDAR
   ========================================= */

#rescheduleCalendar {
  border: 1px solid #dddddd;
  border-radius: 12px;
  padding: 16px;
  margin-top: 8px;
  background: #ffffff;
}

#rescheduleCalendar .calendar-header {
  display: grid;
  grid-template-columns: 42px 1fr 42px;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}

#rescheduleCalendar .calendar-month {
  text-align: center;
  font-size: 18px;
  font-weight: 700;
}

#rescheduleCalendar .calendar-nav {
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid #dddddd;
  border-radius: 9px;
  background: #ffffff;
  color: #000000;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
}

#rescheduleCalendar .calendar-nav:hover:not(:disabled) {
  border-color: #ff0000;
}

#rescheduleCalendar .calendar-nav:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

#rescheduleCalendar .calendar-weekdays,
#rescheduleCalendar .calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

#rescheduleCalendar .calendar-weekdays span {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: #666666;
  padding: 6px 0;
}

#rescheduleCalendar .calendar-day {
  min-height: 42px;
  padding: 7px 4px;
  border: 1px solid #dddddd;
  border-radius: 8px;
  background: #ffffff;
  color: #000000;
  font-size: 15px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

#rescheduleCalendar .calendar-day.available {
  cursor: pointer;
}

#rescheduleCalendar .calendar-day.available:hover {
  border-color: #ff0000;
}

#rescheduleCalendar .calendar-day.selected {
  background: #ff0000;
  color: #ffffff;
  border-color: #ff0000;
}

#rescheduleCalendar .calendar-day.unavailable,
#rescheduleCalendar .calendar-day.outside-range {
  background: #f1f1f1;
  color: #aaaaaa;
  cursor: not-allowed;
}

#rescheduleCalendar .calendar-day.blank {
  visibility: hidden;
  border: 0;
}

#newDateDisplay {
  background: #f8f8f8;
  cursor: default;
}

@media (max-width: 450px) {

  #rescheduleCalendar {
    padding: 10px;
  }

  #rescheduleCalendar .calendar-weekdays,
  #rescheduleCalendar .calendar-days {
    gap: 3px;
  }

  #rescheduleCalendar .calendar-day {
    min-height: 38px;
    font-size: 14px;
  }
}
    
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->

    <!-- LOADING -->

      id="loading"

    </div>

    <!-- ERROR -->

    <div
      id="errorMessage"

    <!-- SUCCESS -->

    <div
      id="successMessage"

    <!-- BOOKING DETAILS -->

    <div
      id="bookingDetails"

    >

      <div class="detail-row">

          id="studentName"

      <div class="detail-row">

      <!-- ACTION BUTTONS -->

      <!-- RESCHEDULE -->

        <div class="field">

<label>New Date</label>

<div

  <div class="calendar-header">

</div>

<input

>

>

    <div

  </div>

  <!-- =======================================================
       CUSTOM ALERT / CONFIRM
  ======================================================== -->

  <div id="customAlertOverlay" aria-hidden="true">
    <div
      id="customAlertBox"
      class="customAlertBox"
      role="dialog"
      aria-modal="true"
      aria-labelledby="customAlertMessage"
    >
      <img
        src="safe-insight-logo.png"
        class="customAlertLogo"
        alt="Safe Insight"
      >

      <div id="customAlertMessage"></div>

      <div class="customAlertButtons">
        <button
          type="button"
          id="customAlertCancel"
          class="customAlertButton cancel"
        >
          Cancel
        </button>

        <button
          type="button"
          id="customAlertOk"
          class="customAlertButton"
        >
          Continue
        </button>
      </div>
    </div>
  </div>

  <script>

    /*
     * SUPABASE
     */

    const SUPABASE_URL =
      "https://mgcjalilweficfafnqas.supabase.co";


    /*
     * READ TOKEN FROM URL
     *
     * Example:
     *
     * manage-booking.html?token=xxxxxxxx
     */

    const params =
      new URLSearchParams(window.location.search);

    const bookingToken =
      params.get("token");

    const paymentResult =
      params.get("payment");


    /*
     * ELEMENTS
     */

    const loading =
      document.getElementById("loading");

    const errorMessage =
      document.getElementById("errorMessage");

    const successMessage =
      document.getElementById("successMessage");

    const bookingDetails =
      document.getElementById("bookingDetails");

    const studentName =
      document.getElementById("studentName");

    const appointmentDate =
      document.getElementById("appointmentDate");

    const appointmentTime =
      document.getElementById("appointmentTime");

    const locationName =
      document.getElementById("locationName");

    const bookingStatus =
      document.getElementById("bookingStatus");

    const rescheduleButton =
      document.getElementById("rescheduleButton");

    const cancelButton =
      document.getElementById("cancelButton");

    const rescheduleSection =
      document.getElementById("rescheduleSection");

    const newDate =
      document.getElementById("newDate");

    const newTime =
      document.getElementById("newTime");

    const newDateDisplay =
  document.getElementById(
    "newDateDisplay"
  );

const rescheduleCalendarDays =
  document.getElementById(
    "rescheduleCalendarDays"
  );

const rescheduleCalendarMonth =
  document.getElementById(
    "rescheduleCalendarMonth"
  );

const rescheduleCalendarPrev =
  document.getElementById(
    "rescheduleCalendarPrev"
  );

const rescheduleCalendarNext =
  document.getElementById(
    "rescheduleCalendarNext"
  );

let rescheduleAvailability = null;

let rescheduleCalendarCurrentMonth = null;

    const confirmRescheduleButton =
      document.getElementById(
        "confirmRescheduleButton"
      );

    const closeRescheduleButton =
      document.getElementById(
        "closeRescheduleButton"
      );


    /*
     * SHOW ERROR
     */

    function showError(message) {

      loading.style.display = "none";

      errorMessage.textContent = message;

      errorMessage.style.display = "block";

    }


    /*
     * SHOW SUCCESS
     */

    function showSuccess(message) {

      successMessage.textContent = message;

      successMessage.style.display = "block";

    }


    /*
     * LOAD BOOKING
     */

    async function loadBooking() {

      if (!bookingToken) {

        showError(
          "This appointment link is missing its booking token."
        );

        return;
      }


      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/functions/v1/get-booking?token=${encodeURIComponent(bookingToken)}`
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load your appointment."
          );

        }


        /*
         * POPULATE DETAILS
         */

        studentName.textContent =
          data.booking.student_name || "";

        appointmentDate.textContent =
          data.booking.appointment_date || "";

        appointmentTime.textContent =
          data.booking.appointment_time || "";

        locationName.textContent =
          data.booking.location_name || "";

        bookingStatus.textContent =
          data.booking.status || "";


        /*
         * DISPLAY BOOKING
         */

        loading.style.display =
          "none";

        bookingDetails.style.display =
          "block";


        /*
         * PAYMENT STATUS MESSAGE
         */

        if (
          paymentResult === "cancelled" &&
          data.booking.status === "pending"
        ) {

          showSuccess(
            "Payment was not completed. Your appointment is not confirmed."
          );

        }


        /*
         * BUTTON AVAILABILITY
         */

        if (
          data.can_cancel === false
        ) {

          cancelButton.disabled =
            true;

          cancelButton.title =
            "This appointment can no longer be cancelled.";

        }


        if (
          data.can_reschedule === false
        ) {

          rescheduleButton.disabled =
            true;

          rescheduleButton.title =
            "This appointment can no longer be rescheduled.";

        }


        /*
         * ALREADY CANCELLED
         */

        if (
          data.booking.status ===
          "cancelled"
        ) {

          cancelButton.disabled =
            true;

          rescheduleButton.disabled =
            true;

        }

      } catch (error) {

        console.error(
          "LOAD BOOKING ERROR:",
          error
        );

        showError(
          error.message ||
          "Unable to load your appointment."
        );

      }

    }


/*
 * RESCHEDULE BUTTON
 */

rescheduleButton.addEventListener(
  "click",
  async () => {

    if (
      rescheduleButton.disabled
    ) {

      return;

    }

    rescheduleSection.style.display =
      "block";

    rescheduleButton.style.display =
      "none";

    cancelButton.style.display =
      "none";


    /*
     * Reset previous selection.
     */

    newDate.value =
      "";

    newDateDisplay.value =
      "";

    newTime.innerHTML = `
      <option value="">
        Select a date first
      </option>
    `;


    try {

      /*
       * Load the complete availability
       * range for this booking.
       */

      const response =
        await fetch(
          `${SUPABASE_URL}/functions/v1/get-availability?token=${encodeURIComponent(bookingToken)}`
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Unable to load availability."
        );

      }


      rescheduleAvailability =
        data;


      /*
       * Start on the first month in
       * the returned availability range.
       */

      if (
        data.days &&
        data.days.length
      ) {

        rescheduleCalendarCurrentMonth =
          data.days[0]
            .date
            .slice(0, 7);

        renderRescheduleCalendar();

      } else {

        rescheduleCalendarDays.innerHTML = `
          <p class="muted">
            No reschedule dates are currently available.
          </p>
        `;

      }


    } catch (error) {

      console.error(
        "LOAD RESCHEDULE CALENDAR ERROR:",
        error
      );


      rescheduleCalendarDays.innerHTML = `
        <p class="muted">
          Unable to load available dates.
        </p>
      `;

    }

  }
);


/*
 * RESCHEDULE CALENDAR NAVIGATION
 */

rescheduleCalendarPrev.addEventListener(
  "click",
  () => {

    if (
      !rescheduleCalendarCurrentMonth
    ) {
      return;
    }


    const [
      year,
      month
    ] =
      rescheduleCalendarCurrentMonth
        .split("-")
        .map(Number);


    const previousMonth =
      new Date(
        year,
        month - 2,
        1
      );


    rescheduleCalendarCurrentMonth =
      [
        previousMonth.getFullYear(),
        String(
          previousMonth.getMonth() + 1
        ).padStart(2, "0")
      ].join("-");


    renderRescheduleCalendar();

  }
);


rescheduleCalendarNext.addEventListener(
  "click",
  () => {

    if (
      !rescheduleCalendarCurrentMonth
    ) {
      return;
    }


    const [
      year,
      month
    ] =
      rescheduleCalendarCurrentMonth
        .split("-")
        .map(Number);


    const nextMonth =
      new Date(
        year,
        month,
        1
      );


    rescheduleCalendarCurrentMonth =
      [
        nextMonth.getFullYear(),
        String(
          nextMonth.getMonth() + 1
        ).padStart(2, "0")
      ].join("-");


    renderRescheduleCalendar();

  }
);

/*
 * CLOSE RESCHEDULE
 */

closeRescheduleButton.addEventListener(
  "click",
  () => {

    rescheduleSection.style.display =
      "none";

    rescheduleButton.style.display =
      "block";

    cancelButton.style.display =
      "block";


    /*
     * Reset reschedule selection.
     */

    newDate.value =
      "";

    newDateDisplay.value =
      "";

    newTime.innerHTML = `
      <option value="">
        Select a time
      </option>
    `;

    rescheduleAvailability =
      null;

    rescheduleCalendarCurrentMonth =
      null;

    rescheduleCalendarDays.innerHTML =
      "";

    rescheduleCalendarMonth.textContent =
      "";

  }
);


    /*
     * DATE CHANGE
     *
     * The backend will eventually return
     * the available times for this date.
     */

function renderRescheduleCalendar() {

  if (
    !rescheduleAvailability?.days?.length ||
    !rescheduleCalendarCurrentMonth
  ) {
    return;
  }

  const [year, month] =
    rescheduleCalendarCurrentMonth
      .split("-")
      .map(Number);

  const monthStart =
    new Date(
      year,
      month - 1,
      1
    );

  const firstWeekday =
    monthStart.getDay();

  const daysInMonth =
    new Date(
      year,
      month,
      0
    ).getDate();

  const availabilityByDate =
    new Map(
      rescheduleAvailability.days.map(
        day => [
          day.date,
          day
        ]
      )
    );

  const minDate =
    rescheduleAvailability
      .days[0]
      .date;

  const maxDate =
    rescheduleAvailability
      .days[
        rescheduleAvailability.days.length - 1
      ]
      .date;

  rescheduleCalendarMonth.textContent =
    monthStart.toLocaleDateString(
      "en-US",
      {
        month: "long",
        year: "numeric"
      }
    );

  rescheduleCalendarDays.innerHTML = "";

  /*
   * Empty cells before the first
   * day of the month.
   */
  for (
    let i = 0;
    i < firstWeekday;
    i++
  ) {

    const blank =
      document.createElement("span");

    blank.className =
      "calendar-day blank";

    blank.setAttribute(
      "aria-hidden",
      "true"
    );

    rescheduleCalendarDays
      .appendChild(blank);
  }

  /*
   * Actual calendar dates.
   */
  for (
    let dayNumber = 1;
    dayNumber <= daysInMonth;
    dayNumber++
  ) {

    const date =
      `${year}-${String(month).padStart(2, "0")}-${String(dayNumber).padStart(2, "0")}`;

    const day =
      availabilityByDate.get(date);

    const button =
      document.createElement(
        "button"
      );

    button.type = "button";

    button.className =
      "calendar-day";

    button.textContent =
      dayNumber;

    button.dataset.date =
      date;

    /*
     * Outside the booking range.
     */
    if (
      date < minDate ||
      date > maxDate ||
      !day
    ) {

      button.disabled = true;

      button.classList.add(
        "outside-range"
      );

      button.setAttribute(
        "aria-label",
        `${date}, unavailable`
      );

    /*
     * Date exists but has
     * no available appointment times.
     */
    } else if (
      !day.has_available
    ) {

      button.disabled = true;

      button.classList.add(
        "unavailable"
      );

      button.setAttribute(
        "aria-label",
        `${day.label}, no availability`
      );

    /*
     * Available date.
     */
    } else {

      button.classList.add(
        "available"
      );

      button.setAttribute(
        "aria-label",
        day.label
      );

      button.addEventListener(
        "click",
        () => {
          selectRescheduleDate(
            date
          );
        }
      );
    }

    /*
     * Currently selected date.
     */
    if (
      date === newDate.value
    ) {
      button.classList.add(
        "selected"
      );
    }

    rescheduleCalendarDays
      .appendChild(button);
  }

  const minMonth =
    minDate.slice(0, 7);

  const maxMonth =
    maxDate.slice(0, 7);

  rescheduleCalendarPrev.disabled =
    rescheduleCalendarCurrentMonth <=
    minMonth;

  rescheduleCalendarNext.disabled =
    rescheduleCalendarCurrentMonth >=
    maxMonth;
}

function selectRescheduleDate(date) {

  const day =
    rescheduleAvailability?.days?.find(
      item =>
        item.date === date
    );

  if (
    !day ||
    !day.has_available
  ) {
    return;
  }

  /*
   * Store the selected date in the
   * existing hidden field used by
   * Confirm Reschedule.
   */
  newDate.value =
    date;

  /*
   * Show the same friendly date label
   * supplied by get-availability.
   */
  newDateDisplay.value =
    day.label || date;

  /*
   * Keep the calendar on the month
   * containing the selected date.
   */
  rescheduleCalendarCurrentMonth =
    date.slice(0, 7);

  /*
   * Redraw so the selected date
   * receives the red highlight.
   */
  renderRescheduleCalendar();

  /*
   * Trigger the existing New Date
   * change handler so New Time loads
   * exactly as it already does.
   */
  newDate.dispatchEvent(
    new Event("change")
  );
}

    
    newDate.addEventListener(
      "change",
      () => {

        newTime.innerHTML = `
          <option value="">
            Select a time
          </option>
        `;


        const days =
          rescheduleAvailability?.days || [];


        const selectedDay =
          days.find(
            day =>
              day.date ===
              newDate.value
          );


        const slots =
          selectedDay?.slots || [];


        slots.forEach(
          slot => {

            if (
              slot.blocked ||
              slot.remaining <= 0
            ) {
              return;
            }


            const option =
              document.createElement(
                "option"
              );


            option.value =
              slot.start;


            option.textContent =
              new Intl.DateTimeFormat(
                "en-US",
                {
                  timeZone:
                    rescheduleAvailability
                      ?.location
                      ?.timezone ||
                    "America/Phoenix",

                  hour:
                    "numeric",

                  minute:
                    "2-digit"
                }
              ).format(
                new Date(
                  slot.start
                )
              );


            newTime.appendChild(
              option
            );

          }
        );


        if (
          newTime.options.length === 1
        ) {

          newTime.innerHTML = `
            <option value="">
              No available times
            </option>
          `;

        }

      }
    );


    /*
     * CONFIRM RESCHEDULE
     */

    confirmRescheduleButton.addEventListener(
      "click",
      async () => {

        if (
          !newDate.value ||
          !newTime.value
        ) {

          alert(
            "Please select a new date and time."
          );

          return;

        }


        confirmRescheduleButton.disabled =
          true;

        confirmRescheduleButton.textContent =
          "Processing...";


        try {

          const response =
            await fetch(
              `${SUPABASE_URL}/functions/v1/reschedule-booking`,
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  token:
                    bookingToken,

                  new_date:
                    newDate.value,

                  new_time:
                    newTime.value

                })

              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Unable to reschedule your appointment."
            );

          }


          showSuccess(
            "Your appointment has been successfully rescheduled."
          );


          rescheduleSection.style.display =
            "none";


          await loadBooking();

        } catch (error) {

          console.error(
            "RESCHEDULE ERROR:",
            error
          );


          showError(
            error.message ||
            "Unable to reschedule your appointment."
          );

        } finally {

          confirmRescheduleButton.disabled =
            false;

          confirmRescheduleButton.textContent =
            "Confirm Reschedule";

        }

      }
    );


    /*
     * CUSTOM ALERT / CONFIRM
     */

    const customAlertOverlay =
      document.getElementById("customAlertOverlay");

    const customAlertMessage =
      document.getElementById("customAlertMessage");

    const customAlertOk =
      document.getElementById("customAlertOk");

    const customAlertCancel =
      document.getElementById("customAlertCancel");


    function showCustomConfirm(message) {

      return new Promise(
        function(resolve) {

          customAlertMessage.textContent =
            message;

          customAlertCancel.style.display =
            "inline-block";

          customAlertOk.textContent =
            "Continue";

          customAlertOverlay.classList.add(
            "show"
          );

          customAlertOverlay.setAttribute(
            "aria-hidden",
            "false"
          );


          function finish(result) {

            customAlertOverlay.classList.remove(
              "show"
            );

            customAlertOverlay.setAttribute(
              "aria-hidden",
              "true"
            );

            customAlertCancel.style.display =
              "none";

            customAlertOk.textContent =
              "OK";

            customAlertOk.removeEventListener(
              "click",
              onConfirm
            );

            customAlertCancel.removeEventListener(
              "click",
              onCancel
            );

            resolve(result);
          }


          function onConfirm() {
            finish(true);
          }


          function onCancel() {
            finish(false);
          }


          customAlertOk.addEventListener(
            "click",
            onConfirm
          );

          customAlertCancel.addEventListener(
            "click",
            onCancel
          );


          customAlertOk.focus();

        }
      );
    }


    /*
     * CANCEL APPOINTMENT
     */

    cancelButton.addEventListener(
      "click",
      async () => {

        if (
          cancelButton.disabled
        ) {

          return;

        }


        const confirmed =
          await showCustomConfirm(
            "Are you sure you want to cancel this appointment?"
          );


        if (!confirmed) {

          return;

        }


        cancelButton.disabled =
          true;

        cancelButton.textContent =
          "Cancelling...";


        try {

          const response =
            await fetch(
              `${SUPABASE_URL}/functions/v1/cancel-booking`,
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  token:
                    bookingToken

                })

              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Unable to cancel your appointment."
            );

          }


          showSuccess(
            "Your appointment has been cancelled successfully."
          );


          bookingStatus.textContent =
            "cancelled";

          cancelButton.disabled =
            true;

          cancelButton.textContent =
            "Appointment Cancelled";


          rescheduleButton.disabled =
            true;


        } catch (error) {

          console.error(
            "CANCEL ERROR:",
            error
          );


          showError(
            error.message ||
            "Unable to cancel your appointment."
          );


          cancelButton.disabled =
            false;

          cancelButton.textContent =
            "Cancel Appointment";

        }

      }
    );


    /*
     * START
     */

    loadBooking();

  </script>
